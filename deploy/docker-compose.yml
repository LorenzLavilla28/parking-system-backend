# Portable local development stack for WSL, Linux, macOS, and Windows Docker
# Desktop. A root .env file is optional and can override the local test defaults.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parkingsaas}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/ParkingSaaS.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-parkingsaas};Username=${POSTGRES_USER:-parking};Password=${POSTGRES_PASSWORD:-parking}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-do-not-use-in-production-1234567890}
      Database__ResetOnStartup: ${DATABASE_RESET_ON_STARTUP:-false}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      PublicUrls__BaseUrl: ${PUBLIC_BASE_URL:-http://localhost:5173}
      # The API uses tenant-owned PayMongo credentials from AWS Secrets Manager.
      # These AWS variables are intentionally passed only to the backend container.
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AwsSecrets__Enabled: ${AWS_SECRETS_ENABLED:-true}
      AwsSecrets__Region: ${AWS_REGION:-ap-southeast-1}
      PayMongo__WebhookBaseUrl: ${PAYMONGO_WEBHOOK_BASE_URL:-http://localhost:5274}
      # Email is disabled by default in Docker. Set EMAIL_ENABLED=true only after
      # providing Microsoft Graph app-only credentials in .env.
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__TenantId: ${EMAIL_TENANT_ID:-}
      Email__ClientId: ${EMAIL_CLIENT_ID:-}
      Email__ClientSecret: ${EMAIL_CLIENT_SECRET:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@parking.local}
      Email__FromName: ${EMAIL_FROM_NAME:-PBP Parking}
      Email__AppBaseUrl: ${EMAIL_APP_BASE_URL:-http://localhost:5173}
    ports:
      # Keep the host port aligned with the existing frontend/local launch URL.
      - "${API_PORT:-5274}:8080"
    volumes:
      - dpkeys:/app/dp-keys

volumes:
  pgdata:
  dpkeys:
